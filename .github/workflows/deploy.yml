# FILE: .github/workflows/deploy.yml
name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the main branch
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm' # Change to 'yarn' or 'pnpm' if you use those
          
      - name: Install dependencies
        run: npm ci # Or yarn install / pnpm install

      # Safety net for anything committed without going through the CMS upload resize.
      # The deployed copy is shrunk here; the repo itself is not changed.
      - name: Shrink oversized images
        run: npm run assets:optimize

      # Lists files over the limits as warnings on the workflow run (does not block the deploy).
      - name: Check asset sizes
        run: npm run assets:check

      # `prebuild` generates the responsive image variants used by ProgressiveImage.
      - name: Build project
        run: npm run build
      
      - name: Generate 404 page for GitHub Pages
        run: cp dist/index.html dist/404.html
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Vite outputs the build to the 'dist' folder

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
