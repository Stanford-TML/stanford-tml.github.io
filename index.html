<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="preload" as="image" href="/assets/loading_spritesheet.webp" type="image/webp">
    <link rel="preload" href="/fonts/Montserrat-VariableFont_wght.ttf" as="font" type="font/ttf" crossorigin>
    <meta name="theme-color" content="#8C1515">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Movement Lab</title>

    <script>
      (function() {
        try {
          var p = localStorage.getItem('experiencePref');
          var isMob = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
          var isLite = p ? p === 'lite' : isMob;
          if (isLite) {
            document.documentElement.classList.add('is-lite-init');
          }
        } catch (e) {}
      })();
    </script>

    <style>
      @font-face {
        font-family: 'Montserrat';
        src: url('/fonts/Montserrat-VariableFont_wght.ttf') format('truetype');
        font-weight: 100 900;
        font-style: normal;
      }
      @keyframes loadingRunnerSprite {
        from { transform: translate3d(0px, 0px, 0px); }
        to { transform: translate3d(-5500px, 0px, 0px); }
      }
      @keyframes liteSpin {
        to { transform: rotate(360deg); }
      }
      html.is-lite-init #initial-loading-shell {
        display: none !important;
      }
      html.is-lite-init #initial-lite-shell {
        display: flex !important;
      }
      .lite-mode-btn {
        position: fixed;
        bottom: 40px;
        left: 40px;
        padding: 15px;
        font-size: 18px;
        background: #af1414;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        z-index: 10000000;
        width: 180px;
        height: 50px;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: background 0.3s, transform 0.3s;
        font-family: 'Montserrat', sans-serif;
      }
      .lite-mode-btn:hover {
        background: #e31b1b !important;
        transform: scale(1.1);
      }
      @media (max-width: 768px) {
        .lite-mode-btn { display: none !important; }
      }
    </style>
  </head>
  <body style="margin: 0; background: #e0e0e0;">
    <div id="root">
      <!-- 3D Desktop Initial Loading Shell -->
      <div id="initial-loading-shell">
        <div style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:#e0e0e0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999999;pointer-events:none;">
          <div style="margin-bottom:0px;transform:translateY(-20px);width:250px;height:250px;position:relative;display:flex;align-items:center;justify-content:center;">
            <div style="width:250px;height:141px;overflow:hidden;position:relative;">
              <img
                src="/assets/loading_spritesheet.webp"
                alt=""
                style="width:5500px;height:141px;max-width:none;display:block;will-change:transform;animation:loadingRunnerSprite 733.33ms steps(22) infinite;transform:translate3d(0,0,0);"
              />
            </div>
          </div>
          <div style="width:300px;height:2px;background:#ccc;border-radius:4px;overflow:hidden;">
            <div style="width:2%;height:100%;background:#af1414;"></div>
          </div>
          <p style="margin:0;margin-top:20px;line-height:1;font-family:'Montserrat',sans-serif;font-size:0.7rem;color:#888;letter-spacing:2px;text-transform:uppercase;">
            INITIALIZING LAB...
          </p>
        </div>

        <button
          class="lite-mode-btn"
          onclick="localStorage.setItem('experiencePref', 'lite'); window.location.reload();"
        >
          ⚡ Lite Mode
        </button>
      </div>

      <!-- Mobile / Lite Mode Initial Loading Shell -->
      <div id="initial-lite-shell" style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:#e0e0e0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:9999999;">
        <div style="width:40px;height:40px;border:3px solid rgba(140,21,21,0.2);border-top-color:#8C1515;border-radius:50%;animation:liteSpin 0.8s linear infinite;"></div>
        <p style="margin:0;margin-top:20px;line-height:1;font-family:'Montserrat',sans-serif;font-size:0.75rem;color:#666;letter-spacing:2px;text-transform:uppercase;">
          LOADING...
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
